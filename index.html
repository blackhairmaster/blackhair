<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F5F2" />

    <!-- SEO -->
    <title>[MASTER_NAME] — Hair Artist in [CITY]</title>
    <meta
      name="description"
      content="[MASTER_DESCRIPTION] Персональный мастер по волосам: кератин, ботокс, холодное восстановление и нанопластика."
    />
    <meta name="author" content="[MASTER_NAME]" />
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="[MASTER_NAME]" />
    <meta property="og:title" content="[MASTER_NAME] — Hair Artist in [CITY]" />
    <meta
      property="og:description"
      content="[MASTER_DESCRIPTION] Персональный мастер по волосам в [CITY]."
    />
    <meta property="og:image" content="%BASE_URL%images/master/master-hero.jpg" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="[MASTER_NAME] — Hair Artist in [CITY]" />
    <meta
      name="twitter:description"
      content="[MASTER_DESCRIPTION] Персональный мастер по волосам в [CITY]."
    />
    <meta name="twitter:image" content="%BASE_URL%images/master/master-hero.jpg" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />

    <meta
      name="keywords"
      content="hair artist, парикмахер, мастер по волосам, кератин, ботокс для волос, нанопластика, холодное восстановление"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* GitHub Pages SPA fallback decoder (pair to public/404.html).
         After 404.html redirects a deep link to /blackhair/?/about,
         restore the clean URL before React Router boots. */
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
