name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows manual re-deploy from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write + id-token:write to publish the artifact
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a queued deploy cancels itself instead
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Project page → site lives at /<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
